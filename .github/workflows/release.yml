name: Firmware release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18 esptool==4.9.0
      - run: python -m unittest discover -s tests -v
      - run: pio run -e esp32-s3 -e esp32-s3-no-web
      - name: Create and verify merged images
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python tools/package_firmware.py --version "$RELEASE_VERSION"
      - name: Publish complete release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const {owner, repo} = context.repo;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
              if (!release.draft) throw new Error('Release is already published; use a new version.');
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: `ESP32-S3 0.42 OLED ${tag}`, draft: true,
                body: fs.readFileSync('RELEASE_NOTES.md', 'utf8')
              })).data;
            }
            const files = ['radio_power_esp32s3_oled_web.bin', 'radio_power_esp32s3_oled_no_web.bin',
                           'manifest.json', 'SHA256SUMS', 'README.md'];
            for (const name of files) {
              const old = release.assets.find(asset => asset.name === name);
              if (old) await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: old.id});
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data: fs.readFileSync(`dist/${name}`)
              });
            }
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id, draft: false, make_latest: 'true'});
